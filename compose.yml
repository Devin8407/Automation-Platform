services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: automation-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      ECHO_SQL: ${ECHO_SQL}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: automation-worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QUEUE_TYPE: ${QUEUE_TYPE}
      QUEUE_LEASE_TIMEOUT_SECONDS: ${QUEUE_LEASE_TIMEOUT_SECONDS}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      ECHO_SQL: ${ECHO_SQL}
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command: automation-scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL}
      LOG_LEVEL: ${LOG_LEVEL}
      ECHO_SQL: ${ECHO_SQL}
    depends_on:
      migrate:
        condition: service_completed_successfully

  reconciler:
    build: .
    command: automation-reconciler
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      ECHO_SQL: ${ECHO_SQL}
    depends_on:
      migrate:
        condition: service_completed_successfully
