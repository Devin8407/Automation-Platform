[project]
name = "automation-platform"
version = "0.1.0"
description = "A plugin-based workflow automation platform."
readme = "README.md"
requires-python = ">=3.14,<3.15"

authors = [
    { name = "Devin MacKay" }
]
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]


[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
target-version = "py314"
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.coverage.report]
exclude_also = [
    "@abstractmethod",
]

[project.scripts]
automation-worker = "automation_platform.runtime.worker.bootstrap:run_worker"
automation-reconciler = "automation_platform.runtime.reconciler.bootstrap:run_reconciler"
automation-scheduler = "automation_platform.runtime.scheduler.bootstrap:run_scheduler"
automation-api = "automation_platform.runtime.api.bootstrap:run_api"
